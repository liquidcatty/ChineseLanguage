<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK Reader</title>
  <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
  <header class="topbar reader-topbar">
    <a class="brand" href="/">
      <span class="brand-cn">中文</span>
      <span class="brand-en">HSK Reader</span>
    </a>
    <div class="reader-tools">
      <a class="back-link" href="/">← Library</a>
      <button id="pinyin-toggle" type="button" class="toggle">Pinyin: off</button>
    </div>
  </header>

  <p id="status" class="status" role="status"></p>

  <main class="reader-page">
    <section id="reader" aria-live="polite">
      <h1 id="title"></h1>
      <p id="story-meta" class="story-meta"></p>
      <label class="finished-label"><input id="finished-check" class="finished-check" type="checkbox"> <span>Finished</span></label>
      <p id="empty" class="empty" hidden>Story not found. <a href="/">Back to the library</a>.</p>
      <div id="story" lang="zh-Hans"></div>
    </section>

    <section id="quiz" hidden>
      <h2>Comprehension</h2>
      <div id="questions"></div>
      <div class="quiz-actions">
        <button id="check" type="button">Check answers</button>
        <span id="score" class="score"></span>
      </div>
    </section>
  </main>

  <div id="popover" class="popover" role="dialog" aria-label="Word details" hidden>
    <div class="pop-char"></div>
    <div class="pop-pinyin"></div>
    <div class="pop-gloss"></div>
    <div class="pop-en"></div>
    <div class="pop-level"></div>
  </div>

  <script src="/static/reader.js?v=6"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK Story Library</title>
  <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
  <header class="topbar library-topbar">
    <a class="brand" href="/">
      <span class="brand-cn">中文</span>
      <span class="brand-en">HSK Story Library</span>
    </a>
  </header>

  <main class="library-page">
    <header class="library-hero">
      <h1>Choose a story</h1>
      <p class="library-sub"><span id="library-count">Loading…</span></p>
      <div class="mode-switch" role="tablist" aria-label="Library mode">
        <button id="mode-reading" class="mode active" type="button" role="tab" aria-selected="true">Reading</button>
        <button id="mode-listening" class="mode" type="button" role="tab" aria-selected="false">Listening</button>
      </div>
      <div class="library-controls">
        <select id="library-level" aria-label="Filter by HSK level">
          <option value="">All levels</option>
          <option value="1">HSK 1</option>
          <option value="2">HSK 2</option>
          <option value="3">HSK 3</option>
        </select>
        <input id="library-search" type="search" placeholder="Search title or noun" aria-label="Search title or noun">
      </div>
    </header>

    <p id="library-status" class="library-status" role="status"></p>
    <div id="story-list" class="story-list"></div>
  </main>

  <script src="/static/library.js?v=6"></script>
</body>
</html>
